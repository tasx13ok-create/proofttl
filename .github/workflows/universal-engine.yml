name: Universal engine cloud gates
on:
  push:
    branches: [codex/universal-proof-engine]
  pull_request:
    branches: [feature/software-first-core]
permissions:
  contents: read
concurrency:
  group: universal-engine-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'tasx13ok-create/proofttl'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve official MCP dependency lock on the implementation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/universal-proof-engine'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "ProofTTL cloud validation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock official MCP SDK and schema dependencies"
            git push origin HEAD:refs/heads/codex/universal-proof-engine
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Record unchanged-corpus baseline failures
        run: node scripts/adversarial-verifier-test.js --baseline-ref c8cf0e4c141b5635675c0ed5eccec2036a725b95 --report benchmark/adversarial/results/before.json --allow-failures
      - name: Run release adversarial corpus
        run: node scripts/adversarial-verifier-test.js --report benchmark/adversarial/results/after.json
      - name: Enforce before/after corpus identity and safety evidence
        run: node scripts/adversarial-compare.js benchmark/adversarial/results/before.json benchmark/adversarial/results/after.json
      - name: Test durable audits and source trust boundary
        run: npm run test:canonical-audit
      - name: Test real MCP transport and authorization
        run: npm run test:mcp
      - name: Test canonical provider adapter and plugin package
        run: npm run test:providers
      - name: Run full repository regression suite
        run: npm run test:local
      - name: Validate Cloudflare Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
      - name: Run current official MCP Inspector
        env:
          PROOFTTL_MCP_CI_EVIDENCE_DIR: benchmark/mcp-results
        run: node scripts/mcp-inspector-test.js
      - name: Deploy and test isolated Cloudflare preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/universal-proof-engine'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/universal-preview-deploy.js
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-engine-evidence
          path: |
            benchmark/adversarial/results/*.json
            benchmark/provider-results/*.json
            benchmark/mcp-results/*.json
          if-no-files-found: warn
          retention-days: 30
