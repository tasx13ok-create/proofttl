name: Model Identity Probe remote smoke test
on:
  push:
    branches:
      - feature/model-identity-probe-remote
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Exercise provider adapters against local mock server
        working-directory: model-identity-probe
        run: node test-adapters.mjs
      - name: Verify public service and MCP JSON-RPC
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://model-identity-probe-clean.onrender.com';
          let latestUiReady = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const candidate = await fetch(base + '/', { cache: 'no-store' });
              if (candidate.ok) {
                const markup = await candidate.text();
                if (markup.includes('href="/styles.css"') && markup.includes('src="/app.js"') && markup.includes('href="/manifest.webmanifest"')) {
                  const [manifestResponse, iconResponse, mcpGetResponse, providerStatusResponse, nullJsonResponse, invalidClaimResponse] = await Promise.all([
                    fetch(base + '/manifest.webmanifest', { cache: 'no-store' }),
                    fetch(base + '/icon.svg', { cache: 'no-store' }),
                    fetch(base + '/api/mcp', { cache: 'no-store' }),
                    fetch(base + '/api/mcp', { method: 'POST', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 7, method: 'tools/call', params: { name: 'probe_provider_status', arguments: {} } }) }),
                    fetch(base + '/api/mcp', { method: 'POST', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: 'null' }),
                    fetch(base + '/api/mcp', { method: 'POST', cache: 'no-store', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 8, method: 'tools/call', params: { name: 'compare_identity_claims', arguments: { claimed_name: { unexpected: true }, provider_returned_model_id: 'model-Y' } } }) })
                  ]);
                  if (manifestResponse.ok && iconResponse.ok && mcpGetResponse.status === 405 && providerStatusResponse.ok && nullJsonResponse.status === 400 && invalidClaimResponse.ok) {
                    const manifest = await manifestResponse.json();
                    const providerRpc = await providerStatusResponse.json();
                    const providerStatus = JSON.parse(providerRpc.result.content[0].text);
                    const invalidClaimRpc = await invalidClaimResponse.json();
                    const invalidClaimStatus = JSON.parse(invalidClaimRpc.result.content[0].text);
                    if (manifest.name === 'Model Identity Probe' && manifest.icons?.some(icon => icon.src === '/icon.svg') && providerStatus.supported_providers?.includes('anthropic') && providerStatus.supported_providers?.includes('gemini') && providerStatus.supported_providers?.includes('bedrock') && providerStatus.supported_providers?.includes('vertex-ai') && providerStatus.supported_providers?.includes('cohere') && invalidClaimStatus.status === 'invalid_input') {
                      latestUiReady = true;
                      break;
                    }
                  }
                }
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert.ok(latestUiReady, 'latest UI and PWA metadata should deploy within 150 seconds');
          const health = await fetch(base + '/health');
          assert.equal(health.status, 200, 'health status');
          assert.equal((await health.json()).status, 'online', 'health payload');
          const page = await fetch(base + '/');
          assert.equal(page.status, 200, 'mobile UI status');
          const pageText = await page.text();
          assert.match(pageText, /Model Identity Probe/, 'mobile UI title');
          assert.match(pageText, /Probe access token/, 'provider probe access-token control');
          assert.match(pageText, /href="\/styles.css"/, 'external stylesheet link');
          assert.match(pageText, /src="\/app.js"/, 'external script link');
          assert.match(pageText, /rel="manifest" href="\/manifest\.webmanifest"/, 'PWA manifest');
          assert.match(pageText, /apple-mobile-web-app-capable/, 'iOS home-screen metadata');
          assert.match(pageText, /href="\/icon\.svg"/, 'app icon');
          assert.equal(page.headers.get('x-content-type-options'), 'nosniff', 'content-type hardening header');
          const pageCsp = page.headers.get('content-security-policy') || '';
          assert.match(pageCsp, /frame-ancestors 'none'/, 'frame restriction CSP');
          assert.ok(!pageCsp.includes('unsafe-inline'), 'CSP must not allow inline scripts or styles');
          const manifestResponse = await fetch(base + '/manifest.webmanifest');
          assert.equal(manifestResponse.status, 200, 'manifest asset status');
          assert.match(manifestResponse.headers.get('content-type') || '', /application\/manifest\+json/, 'manifest content type');
          const manifest = await manifestResponse.json();
          assert.equal(manifest.name, 'Model Identity Probe', 'manifest name');
          assert.equal(manifest.display, 'standalone', 'standalone display mode');
          assert.equal(manifest.icons[0].src, '/icon.svg', 'manifest icon');
          const icon = await fetch(base + '/icon.svg');
          assert.equal(icon.status, 200, 'icon asset status');
          assert.match(icon.headers.get('content-type') || '', /image\/svg\+xml/, 'icon content type');
          assert.match(await icon.text(), /<svg/, 'SVG icon markup');
          const css = await fetch(base + '/styles.css');
          assert.equal(css.status, 200, 'stylesheet asset status');
          assert.match(css.headers.get('content-type') || '', /text\/css/, 'stylesheet content type');
          const js = await fetch(base + '/app.js');
          assert.equal(js.status, 200, 'script asset status');
          assert.match(js.headers.get('content-type') || '', /javascript/, 'script content type');
          async function rpc(method, params = {}) {
            const response = await fetch(base + '/api/mcp', {
              method: 'POST',
              headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 42, method, params })
            });
            assert.equal(response.status, 200, method + ' HTTP status');
            const data = await response.json();
            assert.equal(data.jsonrpc, '2.0', method + ' JSON-RPC version');
            assert.equal(data.id, 42, method + ' request ID');
            assert.ok(!data.error, method + ' JSON-RPC error');
            return data.result;
          }
          const init = await rpc('initialize', { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'smoke-test', version: '1' } });
          assert.equal(init.serverInfo.name, 'model-identity-probe', 'initialize server name');
          const list = await rpc('tools/list');
          const names = list.tools.map(t => t.name);
          for (const name of ['probe_current_runtime','probe_provider_status','probe_provider','compare_identity_claims','inspect_provider_metadata']) assert.ok(names.includes(name), 'tool exposed: ' + name);
          const providerTool = list.tools.find(t => t.name === 'probe_provider');
          assert.deepEqual(providerTool.inputSchema.required, ['access_token'], 'provider probe requires access token');
          const runtime = await rpc('tools/call', { name: 'probe_current_runtime', arguments: {} });
          const runtimeData = JSON.parse(runtime.content[0].text);
          assert.ok(['identity_not_exposed','metadata_exposed_unverified'].includes(runtimeData.status), 'runtime status');
          assert.ok(!Object.keys(runtimeData.exposed_metadata || {}).some(k => /KEY|TOKEN|SECRET/i.test(k)), 'runtime probe must not expose credential-like env keys');
          const provider = await rpc('tools/call', { name: 'probe_provider_status', arguments: {} });
          const providerData = JSON.parse(provider.content[0].text);
          assert.ok(['configured','not_configured','invalid_configuration'].includes(providerData.status), 'provider config status');
          assert.ok(['openai','openai-compatible','openrouter','anthropic','gemini','azure-openai','xai','deepseek','mistral','groq','together','fireworks','perplexity','bedrock','vertex-ai','cohere'].includes(providerData.provider), 'configured adapter is recognized');
          assert.deepEqual(providerData.supported_providers, ['openai','openai-compatible','openrouter','anthropic','gemini','azure-openai','xai','deepseek','mistral','groq','together','fireworks','perplexity','bedrock','vertex-ai','cohere'], 'provider adapter inventory');
          const providerProbe = await rpc('tools/call', { name: 'probe_provider', arguments: {} });
          const probeData = JSON.parse(providerProbe.content[0].text);
          assert.ok(['not_configured','unauthorized','invalid_configuration'].includes(probeData.status), 'provider probe must be disabled or require token');
          assert.equal(probeData.network_request_made, false, 'unauthorized/unconfigured probe must not make a provider request');
          const equal = await rpc('tools/call', { name: 'compare_identity_claims', arguments: { claimed_name: 'model-X', provider_returned_model_id: 'model-X' } });
          assert.equal(JSON.parse(equal.content[0].text).status, 'exact_string_match', 'exact match behavior');
          const mismatch = await rpc('tools/call', { name: 'compare_identity_claims', arguments: { claimed_name: 'model-X', provider_returned_model_id: 'model-Y' } });
          assert.equal(JSON.parse(mismatch.content[0].text).status, 'mismatch_or_alias', 'mismatch behavior');
          const invalidClaim = await rpc('tools/call', { name: 'compare_identity_claims', arguments: { claimed_name: { unexpected: true }, provider_returned_model_id: 'model-Y' } });
          assert.equal(JSON.parse(invalidClaim.content[0].text).status, 'invalid_input', 'non-string identity claim rejected');
          const oversizedClaim = await rpc('tools/call', { name: 'compare_identity_claims', arguments: { claimed_name: 'x'.repeat(201), provider_returned_model_id: 'model-Y' } });
          assert.equal(JSON.parse(oversizedClaim.content[0].text).status, 'invalid_input', 'oversized identity claim rejected');
          const unsupportedGet = await fetch(base + '/api/mcp');
          assert.equal(unsupportedGet.status, 405, 'MCP GET without SSE must return method not allowed');
          assert.match(unsupportedGet.headers.get('allow') || '', /POST/, 'MCP endpoint allowed methods');
          const preflight = await fetch(base + '/api/mcp', { method: 'OPTIONS' });
          assert.equal(preflight.status, 204, 'MCP CORS preflight');
          assert.equal(preflight.headers.get('access-control-allow-origin'), '*', 'MCP CORS origin header');
          const unknown = await fetch(base + '/api/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 99, method: 'tools/call', params: { name: 'not_a_tool', arguments: {} } }) });
          assert.equal(unknown.status, 400, 'unknown tool should be rejected');
          const unknownBody = await unknown.json();
          assert.equal(unknownBody.error.code, -32602, 'unknown tool error code');
          const invalidJson = await fetch(base + '/api/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{' });
          assert.equal(invalidJson.status, 400, 'malformed JSON should be rejected');
          assert.equal((await invalidJson.json()).error.code, -32700, 'malformed JSON error code');
          const nullJson = await fetch(base + '/api/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: 'null' });
          assert.equal(nullJson.status, 400, 'JSON null should be rejected safely');
          assert.equal((await nullJson.json()).error.code, -32600, 'JSON null invalid-request error code');
          const arrayJson = await fetch(base + '/api/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '[]' });
          assert.equal(arrayJson.status, 400, 'JSON array should be rejected safely');
          assert.equal((await arrayJson.json()).error.code, -32600, 'JSON array invalid-request error code');
          const oversized = await fetch(base + '/api/mcp', { method: 'POST', headers: { 'content-type': 'application/json' }, body: ' '.repeat(70 * 1024) });
          assert.equal(oversized.status, 413, 'oversized request should be rejected');
          console.log('PASS: health, mobile UI, PWA metadata, icon, MCP initialization, tool discovery/calls, provider safety gate, exact match, mismatch, malformed JSON, body-size limit, unknown-tool rejection');
          NODE
