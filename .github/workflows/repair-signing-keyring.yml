name: Repair ProofTTL Signing Keyring

on:
  workflow_run:
    workflows: ["ProofTTL v1 Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofttl-production-worker
  cancel-in-progress: false

jobs:
  rotate-signing-keyring:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout the completed deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine whether this deployment requested a one-time rotation
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_repair=true" >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r "${{ github.event.workflow_run.head_sha }}" | grep -Fxq ".ops/repair-signing-keyring.trigger"; then
            echo "run_repair=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_repair=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.request.outputs.run_repair == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        if: steps.request.outputs.run_repair == 'true'
        run: npm ci --no-audit --no-fund

      - name: Require Cloudflare deployment credentials
        if: steps.request.outputs.run_repair == 'true'
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Generate, self-test, and install signing keyring
        if: steps.request.outputs.run_repair == 'true'
        id: rotate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rotate-signing-keyring.js | npx wrangler secret put PROOFTTL_SIGNING_KEYRING_JSON --name proofttl

      - name: Verify deployed public key and health
        if: steps.request.outputs.run_repair == 'true'
        env:
          EXPECTED_KID: ${{ steps.rotate.outputs.kid }}
          EXPECTED_PUBLIC_X: ${{ steps.rotate.outputs.public_x }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_KID"
          test -n "$EXPECTED_PUBLIC_X"
          verified=false
          for attempt in {1..12}; do
            if body="$(curl --fail --silent --show-error https://proofttl.tasx13ok.workers.dev/.well-known/proofttl-keys.json 2>/dev/null)"; then
              if jq -e --arg kid "$EXPECTED_KID" --arg x "$EXPECTED_PUBLIC_X" '
                .active_kid == $kid and
                ([.keys[] | select(.kid == $kid and .x == $x)] | length == 1) and
                ([.keys[] | select(has("d") or has("private_jwk") or has("key_ops"))] | length == 0)
              ' <<< "$body" >/dev/null; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          test "$verified" = true || { echo "Live signing JWKS did not match the generated key; refusing to report success."; exit 1; }
          curl --fail --silent --show-error https://proofttl.tasx13ok.workers.dev/health | jq -e '.ok == true' >/dev/null
          echo "Live JWKS matches the generated Ed25519 public key; health endpoint is OK. No paid transaction was attempted."
