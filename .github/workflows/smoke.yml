name: ProofTTL Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run SSRF security regression checks
        run: npm run test:security

      - name: Run request/source limit regression checks
        run: npm run test:limits

      - name: Run lease lifecycle regression checks
        run: npm run test:regression

      - name: Run live ProofTTL smoke checks
        run: npm run test:smoke
