name: ProofTTL Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run SSRF security regression checks
        run: npm run test:security

      - name: Run request/source limit regression checks
        run: npm run test:limits

      - name: Run cost accounting regression checks
        run: npm run test:costs

      - name: Run lease economics regression checks
        run: npm run test:economics

      - name: Guard idle monitor KV write budget
        run: npm run test:monitor-cost

      - name: Validate semantic benchmark fixtures
        run: npm run test:model-fixtures

      - name: Validate hybrid semantic model routing
        run: npm run test:model-routing

      - name: Validate pre-settlement payment gate
        run: npm run test:payment-gate

      - name: Run lease lifecycle regression checks
        run: npm run test:regression

      - name: Run live ProofTTL smoke checks
        run: npm run test:smoke
