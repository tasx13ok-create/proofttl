name: ProofTTL Code Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Core security, limits, economics, lease primitives
        run: npm run test:security && npm run test:limits && npm run test:costs && npm run test:economics && npm run test:monitor-cost && npm run test:lease-store && npm run test:lease-signing && npm run test:claim-contract-ttl && npm run test:verification-primitives && npm run test:verification-plan && npm run test:claim-decomposition-api && npm run test:discovery-signing && npm run test:event-signing

      - name: Commercial, account, platform primitives
        run: npm run test:audit-intake && npm run test:audit-sales && npm run test:stripe-payments && npm run test:account-workspace && npm run test:studio-runner && npm run test:capabilities && npm run test:platform-spine && npm run test:http-cors

      - name: Assistant and entitlement primitives
        run: npm run test:assistant-cors && npm run test:assistant && npm run test:assistant-text && npm run test:assistant-speech && npm run test:assistant-visuals && npm run test:assistant-quota && npm run test:assistant-model-router && npm run test:entitlements

      - name: Readiness, auth, routing, payment, research, regression
        run: npm run test:readiness && npm run test:auth && npm run test:auth-schema && npm run test:model-fixtures && npm run test:model-routing && npm run test:payment-gate && npm run test:cdp-auth && npm run test:mira && npm run test:foundry-research && npm run test:foundry && npm run test:regression && npm run test:release

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
